<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flows Guide · API Tester</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23161b22'/%3E%3Cpath d='M8 12h13m-4-4 4 4-4 4M24 20H11m4-4-4 4 4 4' fill='none' stroke='%234493f8' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root { --bg: #0d1117; --bg2: #161b22; --bg3: #1f2630; --border: #2d333b; --text: #e6edf3; --muted: #8b949e; --accent: #4493f8; --amber: #d29922; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #ffffff; --bg2: #f6f8fa; --bg3: #eaeef2; --border: #d0d7de; --text: #1f2328; --muted: #59636e; --accent: #0969da; --amber: #9a6700; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15.5px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wrap { display: grid; grid-template-columns: 250px minmax(0, 1fr); max-width: 1180px; margin: 0 auto; gap: 32px; padding: 0 16px; }
    nav { position: sticky; top: 0; align-self: start; max-height: 100vh; overflow: auto; padding: 24px 0; font-size: 14px; }
    nav a { display: block; color: var(--muted); text-decoration: none; padding: 3px 0 3px 10px; border-left: 2px solid transparent; }
    nav a:hover, nav a.on { color: var(--text); border-left-color: var(--accent); }
    nav .back { margin-bottom: 14px; padding-left: 0; border: 0; color: var(--accent); }
    main { padding: 24px 0 80px; min-width: 0; }
    h1 { font-size: 30px; line-height: 1.25; margin: 8px 0 6px; }
    h2 { font-size: 22px; margin: 40px 0 10px; padding-top: 8px; border-top: 1px solid var(--border); }
    h3 { font-size: 17px; margin: 26px 0 8px; }
    a { color: var(--accent); }
    code { font-family: var(--mono); font-size: .88em; background: var(--bg3); padding: 1px 6px; border-radius: 5px; overflow-wrap: anywhere; }
    pre { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; overflow: auto; }
    pre code { background: none; padding: 0; }
    blockquote { margin: 16px 0; padding: 10px 14px; background: var(--bg2); border-left: 4px solid var(--amber); border-radius: 0 8px 8px 0; }
    blockquote p { margin: 0; }
    table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14.5px; display: block; overflow-x: auto; }
    th, td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; vertical-align: top; }
    th { background: var(--bg2); }
    hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0; }
    li { margin: 3px 0; }
    .msg { color: var(--muted); }
    @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; gap: 0; } nav { position: static; max-height: none; padding-bottom: 0; } nav a:not(.back) { display: none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <nav id="toc"><a class="back" href="/apitestingbruno">← Back to the API Tester</a></nav>
    <main id="doc"><p class="msg">Loading the guide…</p></main>
  </div>
  <script>
    // A small Markdown renderer for this one document: headings, paragraphs, lists, tables, quotes, code, links.
    const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const slug = (s) => s.toLowerCase().replace(/<[^>]+>/g, '').replace(/[^a-z0-9 -]/g, '').trim().replace(/ /g, '-');   // GitHub-style anchors
    function inline(s) {
      const codes = [];
      s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push('<code>' + esc(c) + '</code>'); return '\u0000' + (codes.length - 1) + '\u0000'; });
      s = esc(s)
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
        .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => '<a href="' + (u.startsWith('#') || /^https?:/.test(u) ? u : '#') + '">' + t + '</a>');
      return s.replace(/\u0000(\d+)\u0000/g, (m, i) => codes[+i]);
    }
    function render(md) {
      const lines = md.replace(/\r/g, '').split('\n');
      const out = [], toc = [];
      let i = 0;
      const isTable = (l) => /^\s*\|.*\|\s*$/.test(l);
      const cells = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      while (i < lines.length) {
        const l = lines[i];
        if (!l.trim()) { i++; continue; }
        let m;
        if ((m = /^(#{1,3})\s+(.*)$/.exec(l))) {
          const n = m[1].length, html = inline(m[2]), id = slug(m[2]);
          out.push(`<h${n} id="${id}">${html}</h${n}>`);
          if (n === 2) toc.push([id, m[2].replace(/`/g, '')]);
          i++; continue;
        }
        if (/^---+\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
        if (/^```/.test(l)) {
          const buf = []; i++;
          while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
          i++; out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue;
        }
        if (/^>\s?/.test(l)) {
          const buf = [];
          while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ''));
          out.push('<blockquote><p>' + inline(buf.join(' ')) + '</p></blockquote>'); continue;
        }
        if (isTable(l) && isTable(lines[i + 1] || '') && /^[\s|:-]+$/.test(lines[i + 1])) {
          const head = cells(l); i += 2;
          const rows = [];
          while (i < lines.length && isTable(lines[i])) rows.push(cells(lines[i++]));
          out.push('<table><thead><tr>' + head.map((c) => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>' +
            rows.map((r) => '<tr>' + r.map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>');
          continue;
        }
        if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
          // a list, with indented continuation lines and nested lists/tables folded into the item text
          const ordered = /^\s*\d+\./.test(l);
          const items = [];
          while (i < lines.length && (/^\s*([-*]|\d+\.)\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length) || (!lines[i].trim() && /^\s{2,}\S|^\s*([-*]|\d+\.)\s+/.test(lines[i + 1] || '') && items.length))) {
            const cur = lines[i];
            if (/^([-*]|\d+\.)\s+/.test(cur)) items.push([cur.replace(/^([-*]|\d+\.)\s+/, '')]);
            else items[items.length - 1].push(cur.replace(/^\s{2,3}/, ''));
            i++;
          }
          out.push((ordered ? '<ol>' : '<ul>') + items.map((it) => '<li>' + render(it.join('\n')).html.replace(/^<p>([\s\S]*?)<\/p>/, '$1') + '</li>').join('') + (ordered ? '</ol>' : '</ul>'));
          continue;
        }
        const buf = [];
        while (i < lines.length && lines[i].trim() && !/^(#{1,3}\s|```|>|---+\s*$)/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s+/.test(lines[i]) && !isTable(lines[i])) buf.push(lines[i++].trim());
        if (buf.length) out.push('<p>' + inline(buf.join(' ')) + '</p>');
        else { out.push('<p>' + inline(lines[i]) + '</p>'); i++; }
      }
      return { html: out.join('\n'), toc };
    }
    fetch('/apitestingbruno/guide.md', { cache: 'no-cache' })
      .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then((md) => {
        const { html, toc } = render(md);
        document.getElementById('doc').innerHTML = html;
        const nav = document.getElementById('toc');
        toc.forEach(([id, text]) => { const a = document.createElement('a'); a.href = '#' + id; a.textContent = text; nav.append(a); });
        if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
        const links = [...nav.querySelectorAll('a:not(.back)')];
        const heads = links.map((a) => document.getElementById(a.getAttribute('href').slice(1)));
        const spy = () => { let k = 0; heads.forEach((h, j) => { if (h && h.getBoundingClientRect().top < 120) k = j; }); links.forEach((a, j) => a.classList.toggle('on', j === k)); };
        addEventListener('scroll', spy, { passive: true }); spy();
      })
      .catch((e) => { document.getElementById('doc').innerHTML = '<p class="msg">Could not load the guide (' + esc(e.message) + ').</p>'; });
  </script>
</body>
</html>
